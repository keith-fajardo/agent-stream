name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # GitHub's Windows, macOS and Linux runners have Chrome: the real-browser suite must run, never skip (browser spec §7).
      - run: npm test
        env:
          AGENT_STREAM_REQUIRE_BROWSER: '1'
      - run: npm run build
      - name: Integration test in VS Code
        if: runner.os != 'Linux'
        run: npm run test:integration -w extension
      - name: Integration test in VS Code (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration -w extension
      - name: Package the universal .vsix
        if: runner.os == 'Linux'
        run: npm run package -w extension
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: agent-stream-vsix
          path: extension/*.vsix
